<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Premium Sport - Home</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #0c0c0e; 
            color: #fff; 
            font-family: 'Arial Black', Gadget, sans-serif;
            min-height: 100vh;
            display: flex; flex-direction: column;
        }

        /* Nav simplificado */
        .top-nav { 
            padding: 20px; display: flex; justify-content: center; gap: 40px; 
            background: #080808; border-bottom: 1px solid #222;
        }
        .nav-link { color: #888; text-decoration: none; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; }
        .nav-link:hover { color: #FFB366; }

        /* Logo/Título */
        header { padding: 60px 20px 40px; text-align: center; }
        header h1 { 
            color: #FFB366; font-size: 4.5rem; letter-spacing: -2px; 
            text-transform: uppercase; font-style: italic;
            text-shadow: 0 0 15px rgba(255, 179, 102, 0.3);
        }

        /* Tarjetas más compactas y elegantes */
        main { 
            display: flex; justify-content: center; gap: 30px; 
            padding: 20px; max-width: 800px; margin: 0 auto;
        }
        .card { 
            flex: 1; height: 150px; /* Altura reducida */
            background: #141416; 
            border: 2px solid #2a2a2a; border-radius: 10px;
            display: flex; flex-direction: column; 
            justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.3s ease; text-decoration: none;
            padding: 15px; /* Espaciado interno */
        }
        .card h2 { font-size: 1.3rem; margin-bottom: 5px; transition: color 0.3s; color: #fff; }
        .card p { color: #777; font-size: 0.75rem; text-align: center; }

        /* Efectos Hover */
        .f1-card:hover { border-color: #00A8FF; box-shadow: 0 0 15px rgba(0, 168, 255, 0.15); }
        .f1-card:hover h2 { color: #00A8FF; }
        
        .motogp-card:hover { border-color: #FF3838; box-shadow: 0 0 15px rgba(255, 56, 56, 0.15); }
        .motogp-card:hover h2 { color: #FF3838; }
    </style>
</head>
<body>

    <nav class="top-nav">
        <a href="#" class="nav-link">Inicio</a>
        <a href="#" class="nav-link">Sobre nosotros</a>
        <a href="#" class="nav-link">Contacto</a>
    </nav>

    <header>
        <h1>PREMIUM SPORT</h1>
    </header>

    <main>
        <a href="f1.html" class="card f1-card">
            <h2>FÓRMULA 1</h2>
            <p>Acceder al live timing de Fórmula 1</p>
        </a>
        <a href="#" class="card motogp-card">
            <h2>MOTOGP</h2>
            <p>Acceder al live timing de MotoGP</p>
        </a>
    </main>

</body>
</html>
