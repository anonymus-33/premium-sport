<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Premium Sport | F1 Live Timing</title>
<style>
    body { background-color: #0b0e14; color: #fff; font-family: 'Segoe UI', sans-serif; }
    .table-data { width: 100%; border-collapse: collapse; }
    .table-data th { text-align: left; padding: 10px; color: #888; font-size: 0.7rem; border-bottom: 2px solid #222; }
    .table-data td { padding: 10px; border-bottom: 1px solid #222; font-size: 0.9rem; }
    .team-logo { width: 25px; height: auto; margin-right: 10px; vertical-align: middle; }
    .driver-name { font-weight: bold; }
    .pit-badge { background: #1c3d5a; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; }
</style>
</head>
<body>

    <header>
        <h1>PREMIUM SPORT | F1 LIVE TIMING</h1>
        <div id="clock">00:00:00</div>
    </header>

    <main class="dashboard-container">
        <section class="timing-table" id="tabla-tiempos">
            <h3>Cargando datos de pista...</h3>
        </section>

        <section class="side-panel">
            <div class="panel">
                <h3>Race Control</h3>
                <p style="font-size: 0.8rem;">Esperando mensajes...</p>
            </div>
            <div class="panel">
                <h3>Team Radio</h3>
                <p style="font-size: 0.8rem;">Esperando transmisiones...</p>
            </div>
        </section>
    </main>

<script>
    // Mapeo básico para logos de equipos
    const teamLogos = {
        "Red Bull Racing": "https://upload.wikimedia.org/wikipedia/en/2/29/Red_Bull_Racing_logo.svg",
        "Ferrari": "https://upload.wikimedia.org/wikipedia/en/c/c0/Scuderia_Ferrari_logo.svg",
        "Mercedes": "https://upload.wikimedia.org/wikipedia/en/f/f4/Mercedes-Benz_Grand_Prix_logo.svg",
        "McLaren": "https://upload.wikimedia.org/wikipedia/en/6/66/McLaren_Racing_logo.svg",
        "Aston Martin": "https://upload.wikimedia.org/wikipedia/en/5/5a/Aston_Martin_Aramco_Cognizant_F1_logo.svg"
    };

    async function cargarDatos() {
        const contenedor = document.getElementById('tabla-tiempos');
        try {
            // ... (código de fetch anterior) ...
            // Asumiendo que 'pilotos' ya tiene la lista
            
            let html = `<table class="table-data">
                <thead><tr><th>POS</th><th>DRIVER</th><th>TEAM</th><th>LAPS</th><th>PIT</th></tr></thead><tbody>`;
            
            pilotos.forEach((p, i) => {
                const logo = teamLogos[p.team_name] || "";
                html += `<tr>
                    <td>${i+1}</td>
                    <td><span class="driver-name">${p.full_name}</span></td>
                    <td><img src="${logo}" class="team-logo"> ${p.team_name}</td>
                    <td>36</td>
                    <td><span class="pit-badge">IN PIT</span></td>
                </tr>`;
            });
            
            html += `</tbody></table>`;
            contenedor.innerHTML = html;
        } catch (err) { contenedor.innerHTML = "Error cargando datos"; }
    }
    cargarDatos();
</script>

</body>
</html>
