<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Premium Sport | F1 Live Timing</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #050505; color: #fff; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; }

        header { background: #00A8FF; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 1.2rem; letter-spacing: 2px; }
        
        .dashboard-container { display: grid; grid-template-columns: 1fr 350px; gap: 10px; padding: 10px; flex: 1; overflow: hidden; }

        /* Estilos profesionales de la tabla */
        .timing-table { background: #0b0e14; border-radius: 5px; padding: 20px; overflow-y: auto; }
        .table-data { width: 100%; border-collapse: collapse; color: #fff; }
        .table-data th { text-align: left; padding: 12px; color: #888; font-size: 0.75rem; text-transform: uppercase; border-bottom: 2px solid #222; }
        .table-data td { padding: 12px; border-bottom: 1px solid #222; font-size: 0.9rem; }
        
        .side-panel { display: flex; flex-direction: column; gap: 10px; }
        .panel { background: #111; border-radius: 5px; padding: 15px; flex: 1; border-top: 4px solid #00A8FF; }
        h3 { font-size: 0.9rem; color: #888; margin-bottom: 10px; text-transform: uppercase; }
    </style>
</head>
<body>

    <header>
        <h1>PREMIUM SPORT | F1 LIVE TIMING</h1>
        <div id="clock">00:00:00</div>
    </header>

    <main class="dashboard-container">
        <section class="timing-table" id="tabla-tiempos">
            <h3>Cargando datos de pista...</h3>
        </section>

        <section class="side-panel">
            <div class="panel">
                <h3>Race Control</h3>
                <p style="font-size: 0.8rem;">Esperando mensajes...</p>
            </div>
            <div class="panel">
                <h3>Team Radio</h3>
                <p style="font-size: 0.8rem;">Esperando transmisiones...</p>
            </div>
        </section>
    </main>

<script>
    async function iniciarDashboard() {
        const contenedor = document.getElementById('tabla-tiempos');
        try {
            contenedor.innerHTML = '<h3>Depurando datos...</h3>';

            const urlSesion = 'https://api.allorigins.win/get?url=' + encodeURIComponent('https://api.openf1.org/v1/sessions?session_name=Race');
            const respSesion = await fetch(urlSesion);
            const dataSesion = await respSesion.json();
            
            // PRIMERA PRUEBA: Vamos a ver qué es realmente "dataSesion"
            console.log("Respuesta cruda del proxy:", dataSesion);
            
            const sesiones = JSON.parse(dataSesion.contents);
            console.log("Sesiones parseadas:", sesiones);

            if (!sesiones || sesiones.length === 0) throw new Error("No hay sesiones de carrera");

            const sesionActual = sesiones[sesiones.length - 1].session_key;
            
            // SEGUNDA PRUEBA: Verificar qué traen los pilotos
            const urlPilotos = 'https://api.allorigins.win/get?url=' + encodeURIComponent('https://api.openf1.org/v1/drivers?session_key=' + sesionActual);
            const respPilotos = await fetch(urlPilotos);
            const dataPilotos = await respPilotos.json();
            const pilotos = JSON.parse(dataPilotos.contents);
            
            console.log("Datos de pilotos:", pilotos); // <--- ESTO ES LA CLAVE

            if (Array.isArray(pilotos)) {
                // Aquí iría tu renderizado
                contenedor.innerHTML = '¡Datos recibidos correctamente! (Revisa la consola para ver los objetos)';
            } else {
                contenedor.innerHTML = '<h3>Error: pilotos no es un array.</h3><p>Mira la consola (F12) para ver el error exacto.</p>';
            }
            
        } catch (error) {
            contenedor.innerHTML = '<h3>Error crítico:</h3><p>' + error.message + '</p>';
        }
    }
    iniciarDashboard();
</script>

</body>
</html>
